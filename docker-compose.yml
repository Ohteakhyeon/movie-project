# Web / WAS / DB 3-tier architecture
# DB tier only in compose — Web·WAS는 로컬에서 각각 실행

services:
  db:
    image: mariadb:11
    container_name: movie-db
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: movie_db
      MARIADB_USER: movie_user
      MARIADB_PASSWORD: movie_pass
      TZ: Asia/Seoul
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  db_data:
